# Break glass path. hived deploys the repo that contains hived, so a commit
# that breaks it cannot deploy its own fix. This one still can.
name: Deploy via Colmena
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H zoe.infra.hayl.in >> ~/.ssh/known_hosts
          ssh-keyscan -H athena.infra.hayl.in >> ~/.ssh/known_hosts
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Run Colmena
        run: |
          nix-shell -p colmena --run "colmena apply --config colmena.nix --parallel 0 --build-on-target --on=zoe,athena"
