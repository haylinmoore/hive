name: Deploy to Infrastructure
on:
  workflow_dispatch:
  push:
    branches:
      - main
# GitHub cancels the older run, hived supersedes the older job. Either alone
# would be enough, together they make back to back pushes a non-event.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [zoe, athena]
    steps:
      # Only the poll script, the node fetches the repo itself.
      - name: Fetch the deploy script
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
          sparse-checkout-cone-mode: false
      - name: Deploy ${{ matrix.host }}
        uses: actions/github-script@v7
        env:
          HOST: ${{ matrix.host }}
          SHA: ${{ github.sha }}
        with:
          script: |
            const script = require('./.github/workflows/deploy.js')
            await script({ core, host: process.env.HOST, sha: process.env.SHA })
