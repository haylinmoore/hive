name: Deploy to Infrastructure
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  # The poke carries nothing. Each hub reads main from GitHub itself and
  # rolls it out over the mesh, so either one answering is enough.
  poke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hub: [athena, zoe]
    steps:
      - name: Poke ${{ matrix.hub }}
        run: curl --fail --silent --show-error --max-time 20 --retry 3 -X POST https://hived.${{ matrix.hub }}.infra.hayl.in/v1/poke
