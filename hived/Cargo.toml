[package]
name = "hived"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
fs2 = "0.4.3"
chrono = "0.4.45"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
futures-util = { version = "0.3.34", default-features = false }
tokio = { version = "1.52.3", features = ["full"] }
