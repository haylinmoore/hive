<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>hived</title>
    <style>
      :root {
        --pg: #fcfbf6;
        --ink: #17160f;
        --dim: #6f6e60;
        --rule: #d5d3c4;
        --zebra: #f4f2e9;
        --ok: #2e6b34;
        --warn: #8a6503;
        --bad: #a52a21;
        --link: #0645ad;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --pg: #16181a;
          --ink: #e6e6df;
          --dim: #8b8d82;
          --rule: #333a3d;
          --zebra: #1d2124;
          --ok: #63b183;
          --warn: #c9a24a;
          --bad: #de8686;
          --link: #79b8ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--pg);
        color: var(--ink);
        margin: 0;
        padding: 0 0 32px;
        font:
          13px/1.55 ui-monospace,
          SFMono-Regular,
          "DejaVu Sans Mono",
          "Courier New",
          monospace;
      }
      a {
        color: var(--link);
      }
      .head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
        border-bottom: 2px solid var(--ink);
        padding: 14px 18px 7px;
        margin-bottom: 14px;
      }
      h1 {
        font-size: 16px;
        margin: 0;
        letter-spacing: 0.06em;
        text-transform: lowercase;
      }
      .clock {
        margin-left: auto;
        color: var(--dim);
        font-size: 11.5px;
      }
      .hosts {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 26px;
        margin: 0 18px 4px;
      }
      .host {
        min-width: 240px;
      }
      .host .name {
        background: var(--ink);
        color: var(--pg);
        padding: 1px 7px;
        font-size: 11.5px;
        letter-spacing: 0.1em;
      }
      .host .line {
        color: var(--dim);
        font-size: 11.5px;
        margin-top: 4px;
      }
      h2 {
        font-size: 10.5px;
        color: var(--dim);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        margin: 20px 18px 7px;
        font-weight: 700;
      }
      .scroll {
        overflow-x: auto;
        padding: 0 18px;
      }
      table {
        border-collapse: collapse;
        font-size: 12.5px;
      }
      th {
        text-align: left;
        color: var(--dim);
        font-size: 10.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 400;
        border-bottom: 1px solid var(--ink);
        padding: 0 11px 5px 0;
        white-space: nowrap;
      }
      td {
        padding: 4px 11px 4px 0;
        white-space: nowrap;
        vertical-align: top;
      }
      tbody tr:nth-child(odd) td {
        background: var(--zebra);
      }
      th:first-child,
      td:first-child {
        padding-left: 8px;
      }
      td.r,
      th.r {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .ok {
        color: var(--ok);
      }
      .warn {
        color: var(--warn);
      }
      .bad {
        color: var(--bad);
      }
      .dim {
        color: var(--dim);
      }
      .subject {
        white-space: normal;
        max-width: 42ch;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 3px 16px;
        margin: 0 18px;
      }
      dt {
        color: var(--dim);
        font-size: 10.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding-top: 2px;
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      pre {
        background: var(--zebra);
        margin: 3px 18px 6px;
        padding: 7px 11px;
        font: 11.5px/1.5 inherit;
        white-space: pre-wrap;
        overflow-x: auto;
        border-left: 3px solid var(--rule);
      }
      pre.err {
        border-left-color: var(--bad);
      }
      .back {
        margin: 18px;
      }
    </style>
  </head>
  <body>
    <div class="head">
      <h1>hived</h1>
      <span class="clock" id="clock"></span>
    </div>
    <div id="view"></div>

    <!--HIVED_CONFIG-->

    <script>
      // One page for both the dashboard on hived.hayl.in and the console each
      // node serves itself. A node injects HIVED_CONFIG naming only itself and
      // an empty base, so the same code talks to one host or to all of them.
      const CONFIG = window.HIVED_CONFIG || {
        hosts: [
          { name: "zoe", base: "https://hived.zoe.infra.hayl.in" },
          { name: "athena", base: "https://hived.athena.infra.hayl.in" },
        ],
      };
      const HOSTS = CONFIG.hosts;
      const baseOf = (name) =>
        (HOSTS.find((h) => h.name === name) || {}).base || "";

      const CLASSES = {
        succeeded: "ok",
        degraded: "warn",
        failed: "bad",
        rejected: "bad",
        interrupted: "bad",
        superseded: "dim",
        cancelled: "dim",
      };

      const PHASES = ["fetch", "verify", "build", "activate", "check"];
      const short = (rev) => (rev || "").slice(0, 7);
      const esc = (t) =>
        String(t == null ? "" : t).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );

      function secs(v) {
        if (v == null) return "–";
        const t = Math.round(v);
        return t >= 60
          ? `${Math.floor(t / 60)}m${String(t % 60).padStart(2, "0")}s`
          : `${t}s`;
      }

      function stamp(t) {
        return t
          ? new Date(t * 1000).toISOString().replace("T", " ").slice(0, 19)
          : "";
      }

      function stateText(d) {
        if (!d) return "–";
        if (d.state === "running") return `running ${d.phase || ""}`.trim();
        if (d.state === "failed" && d.error) return `failed ${d.error.phase}`;
        return d.state;
      }

      const get = (url) =>
        fetch(url).then((r) => (r.ok ? r.json() : Promise.reject(r.status)));

      async function loadHost(host) {
        const base = host.base;
        const [status, list] = await Promise.all([
          get(`${base}/v1/status`),
          get(`${base}/v1/deployments?limit=100`),
        ]);
        return { host: host.name, status, deployments: list.deployments || [] };
      }

      function renderHosts(results) {
        return results
          .map(({ host, status, error }) => {
            if (error) {
              return `<div class="host"><span class="name">${esc(host).toUpperCase()}</span>
                <div class="line bad">unreachable</div></div>`;
            }
            const d = status.deployed;
            const drift = status.drifted
              ? `<span class="warn">drifted</span>`
              : `<span class="ok">in sync</span>`;
            const failing = (status.system_failed_units || []).join(", ");
            const run = status.running;
            return `<div class="host">
              <span class="name">${esc(host).toUpperCase()}</span>
              <div class="line">${
                d
                  ? `<a href="#/${esc(host)}/${d.id}">${short(d.rev)}</a> ${esc(d.subject)}`
                  : "nothing deployed by hived yet"
              }</div>
              <div class="line">generation ${esc((d && d.generation) || "?")}, ${drift}${
                failing ? `, failing: ${esc(failing)}` : ""
              }</div>
              ${
                run
                  ? `<div class="line">now: <a href="#/${esc(host)}/${run.id}">${short(run.rev)}</a> ${esc(stateText(run))}</div>`
                  : ""
              }
            </div>`;
          })
          .join("");
      }

      function renderHistory(results) {
        // Union of every commit any node has seen, newest first, so a commit
        // that passed on one and failed on another sits on one row.
        const rows = new Map();
        for (const { host, deployments } of results) {
          for (const d of deployments) {
            if (!rows.has(d.rev)) {
              rows.set(d.rev, {
                rev: d.rev,
                subject: d.subject,
                when: d.queued_at,
                by: {},
              });
            }
            const row = rows.get(d.rev);
            row.when = Math.max(row.when, d.queued_at);
            if (d.subject && !row.subject) row.subject = d.subject;
            if (!row.by[host] || d.id > row.by[host].id) row.by[host] = d;
          }
        }
        const ordered = [...rows.values()].sort((a, b) => b.when - a.when);
        if (!ordered.length)
          return `<h2>history</h2><p class="back dim">no deploys recorded yet</p>`;

        const head = HOSTS.map(
          (h) => `<th>${esc(h.name)}</th><th class="r">time</th>`,
        ).join("");
        const body = ordered
          .map((row) => {
            const cells = HOSTS.map(({ name }) => {
              const d = row.by[name];
              if (!d) return `<td class="dim">–</td><td class="r dim">–</td>`;
              const cls = CLASSES[d.state] || "";
              return `<td class="${cls}"><a href="#/${esc(name)}/${d.id}">${esc(stateText(d))}</a></td>
                      <td class="r dim">${secs(d.total)}</td>`;
            }).join("");
            return `<tr><td>${short(row.rev)}</td>
              <td class="subject">${esc(row.subject)}</td>${cells}</tr>`;
          })
          .join("");
        return `<h2>history</h2><div class="scroll"><table>
          <thead><tr><th>rev</th><th>commit</th>${head}</tr></thead>
          <tbody>${body}</tbody></table></div>`;
      }

      async function renderOverview() {
        const results = await Promise.all(
          HOSTS.map((h) =>
            loadHost(h).catch((error) => ({
              host: h.name,
              error,
              deployments: [],
            })),
          ),
        );
        document.getElementById("view").innerHTML =
          `<div class="hosts">${renderHosts(results)}</div>${renderHistory(results)}`;
        return results.some((r) => !r.error && r.status.running);
      }

      async function renderDetail(host, id) {
        const base = baseOf(host);
        const view = document.getElementById("view");
        let d;
        try {
          d = await get(`${base}/v1/deployments/${id}`);
        } catch (e) {
          view.innerHTML = `<p class="back bad">could not load ${esc(host)} #${esc(id)} (${esc(e)})</p>
            <p class="back"><a href="#/">back</a></p>`;
          return false;
        }

        let log = "";
        if (!d.log_reaped) {
          try {
            const r = await fetch(`${base}/v1/deployments/${id}/logs`);
            if (r.ok) log = await r.text();
          } catch {
            log = "(log unavailable)";
          }
        }

        const phases = PHASES.filter(
          (p) => d.durations && d.durations[p] != null,
        )
          .map((p) => `${p} ${secs(d.durations[p])}`)
          .join(", ");

        view.innerHTML = `<dl>
            <dt>host</dt><dd>${esc(host)}</dd>
            <dt>deployment</dt><dd>#${esc(d.id)}</dd>
            <dt>rev</dt><dd>${esc(d.rev)}</dd>
            <dt>commit</dt><dd>${esc(d.subject)}</dd>
            <dt>state</dt><dd class="${CLASSES[d.state] || ""}">${esc(stateText(d))}</dd>
            <dt>queued</dt><dd>${stamp(d.queued_at)}</dd>
            ${d.total != null ? `<dt>took</dt><dd>${secs(d.total)}</dd>` : ""}
            ${phases ? `<dt>phases</dt><dd>${esc(phases)}</dd>` : ""}
            ${d.generation ? `<dt>generation</dt><dd>${esc(d.generation)}</dd>` : ""}
            ${
              (d.preexisting_failed_units || []).length
                ? `<dt>already failing</dt><dd class="dim">${esc(d.preexisting_failed_units.join(", "))}</dd>`
                : ""
            }
            ${
              (d.new_failed_units || []).length
                ? `<dt>newly failed</dt><dd class="warn">${esc(d.new_failed_units.join(", "))}</dd>`
                : ""
            }
          </dl>
          ${d.error ? `<h2>error</h2><pre class="err">${esc(d.error.message)}</pre>` : ""}
          <h2>log</h2>
          ${d.log_reaped ? `<p class="back dim">log was reaped, the error above is what was kept</p>` : `<pre>${esc(log)}</pre>`}
          <p class="back"><a href="#/">back</a></p>`;

        return d.state === "running" || d.state === "queued";
      }

      let timer = null;

      async function route() {
        const m = (location.hash || "").match(/^#\/([A-Za-z0-9_-]+)\/(\d+)$/);
        let live = false;
        try {
          live = m ? await renderDetail(m[1], m[2]) : await renderOverview();
        } catch (e) {
          document.getElementById("view").innerHTML =
            `<p class="back bad">${esc(e)}</p><p class="back"><a href="#/">back</a></p>`;
        }
        document.getElementById("clock").textContent = new Date()
          .toISOString()
          .replace("T", " ")
          .slice(0, 19);

        // Poll fast while something is moving, slowly when nothing is.
        clearTimeout(timer);
        timer = setTimeout(route, live ? 5000 : 30000);
      }

      window.addEventListener("hashchange", route);
      route();
    </script>
  </body>
</html>
