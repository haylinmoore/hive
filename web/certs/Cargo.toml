[package]
name = "certs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
futures-util = "0.3.34"
maud = { version = "0.27.0", features = ["axum"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.1"
tokio = { version = "1.52.3", features = ["full"] }
x509-parser = "0.18.1"
